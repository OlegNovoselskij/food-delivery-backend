x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/fooddelivery
  SECRET_KEY: dev-secret-key-change-me-in-production-min-32-bytes
  ADMIN_SESSION_SECRET: dev-admin-session-secret-change-me-in-production
  ADMIN_COOKIE_SECURE: "false"
  S3_ENDPOINT_URL: http://rustfs:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY: rustfsadmin
  S3_SECRET_KEY: rustfsadmin
  S3_BUCKET: courses
  VALKEY_URL: redis://valkey:6379/0
  ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:8000"
  PUBLIC_API_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:5173
  EMAIL_PROVIDER: smtp
  EMAIL_FROM_ADDRESS: no-reply@courses.local
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_TEST_PAGE_ENABLED: "true"

services:
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment: *app-environment
    volumes:
      - .:/code
    depends_on:
      - db
      - rustfs
      - valkey

  worker:
    build: .
    command: python -m app.worker
    environment:
      <<: *app-environment
      EMAIL_RETRY_BASE_SECONDS: "10"
    volumes:
      - .:/code
    depends_on:
      - db
      - mailpit
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fooddelivery
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  valkey:
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  rustfs-data:
